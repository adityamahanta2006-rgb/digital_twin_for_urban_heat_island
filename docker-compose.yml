version: '3.8'

services:
  web:
    build: ./rose-api/
    ports:
      - ${HOST_HTTP_WEB_PORT}:80
      - ${HOST_HTTPS_WEB_PORT}:443
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      geoserver:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${HOST_OUTPUT_DIR}:/results
      - ${HOST_PROCESSING_DIR}:/geoapi/processes/custom_processes
      - ${HOST_STORAGE_DIR}:/data_dir
    
  db:
    image: postgis/postgis:16-3.4-alpine
    env_file:
      - .env
    ports:
      - ${HOST_DB_PORT}:${POSTGRES_PORT}
    restart: on-failure
    volumes:
      - db_data:/var/lib/postgresql/data  
      - "./rose-api/init_db:/docker-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - .env
    ports:
        - ${HOST_RABBITMQ_PORT}:5672
        - ${HOST_RABBITMQ_MANAGEMENT_PORT}:15672
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
        - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq

  geoserver:
    image: kartoza/geoserver:2.27.2
    ports:
      - ${HOST_GEOSERVER_PORT}:8080
    env_file:
      - .env
    volumes:
      - ${HOST_STORAGE_DIR}:/data_dir
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://geoserver:8080/geoserver/web/ | grep -q geoserver"]
      interval: 30s
      timeout: 10s
      retries: 10

  frontend:
    build: ./piero/
    ports:
      - ${HOST_FRONTEND_PORT}:80
    env_file:
      - .env
    depends_on:
      geoserver:
        condition: service_healthy
      web:
        condition: service_started

  udt-data-assembler:
    build: ./udt-assembler/
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    volumes:
      - ${HOST_STORAGE_DIR}:/data_dir

volumes:
  db_data:
  data_dir: {}   # one shared persistent volume for all containers

